<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascent AI</title>
  <link rel="icon" href="https://img.icons8.com/?size=100&id=n1Z4H7G4RdY0&format=png&color=000000" type="image/png" />
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
  </script>
</head>

</body>
